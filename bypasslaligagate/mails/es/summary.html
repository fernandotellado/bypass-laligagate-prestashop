<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<title>Resumen Bypass LaLigaGate</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333; max-width: 640px; margin: 0 auto; padding: 16px;">
	<h2 style="color: #2271b1;">Resumen {label}</h2>
	<p>Hola,</p>
	<p>Este es el resumen {label} de Bypass LaLigaGate.</p>
	<table style="width: 100%; border-collapse: collapse; margin: 16px 0;">
		<tr><td style="padding: 6px 12px; background: #f4f4f4;"><strong>Tienda</strong></td><td style="padding: 6px 12px;">{shop_name}</td></tr>
		<tr><td style="padding: 6px 12px; background: #f4f4f4;"><strong>URL</strong></td><td style="padding: 6px 12px;"><a href="{shop_url}">{shop_url}</a></td></tr>
		<tr><td style="padding: 6px 12px; background: #f4f4f4;"><strong>Periodo</strong></td><td style="padding: 6px 12px;">{period_from} &rarr; {period_to}</td></tr>
		<tr><td style="padding: 6px 12px; background: #f4f4f4;"><strong>Bloqueos detectados</strong></td><td style="padding: 6px 12px;">{count}</td></tr>
	</table>
	<div style="background: #f9f9f9; border: 1px solid #ddd; padding: 12px; border-radius: 3px; font-family: Consolas, Monaco, monospace; font-size: 13px; line-height: 1.6;">
		{detail_html}
	</div>
	<p><a href="{admin_link}" style="color: #2271b1;">Consultar estado actual</a></p>
	<hr style="border: 0; border-top: 1px solid #eee; margin: 24px 0;" />
	<p style="font-size: 12px; color: #999;">Bypass LaLigaGate v{version}</p>
</body>
</html>
